name: Deploy to server

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Pull & redeploy
    runs-on: ubuntu-latest

    env:
      # Secrets
      MONGO_ROOT_USERNAME: ${{ secrets.MONGO_ROOT_USERNAME }}
      MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
      MONGO_USERNAME: ${{ secrets.MONGO_USERNAME }}
      MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      # Variables
      MONGO_HOST: ${{ vars.MONGO_HOST }}
      MONGO_PORT: ${{ vars.MONGO_PORT }}
      MONGO_HOST_PORT: ${{ vars.MONGO_HOST_PORT }}
      MONGO_DATABASE: ${{ vars.MONGO_DATABASE }}
      SREALITY_BASE_URL: ${{ vars.SREALITY_BASE_URL }}
      PER_PAGE: ${{ vars.PER_PAGE }}
      MAX_ESTATES: ${{ vars.MAX_ESTATES }}
      HTTP_CONNECT_TIMEOUT_MS: ${{ vars.HTTP_CONNECT_TIMEOUT_MS }}
      HTTP_READ_TIMEOUT_MS: ${{ vars.HTTP_READ_TIMEOUT_MS }}
      REQUEST_DELAY_MS: ${{ vars.REQUEST_DELAY_MS }}

    steps:
      - name: Write .env and redeploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Pass all secrets/variables as env vars into the SSH session.
          # This avoids special-character shell-interpretation issues that occur
          # when values are substituted inline into a heredoc script.
          envs: MONGO_HOST,MONGO_PORT,MONGO_HOST_PORT,MONGO_DATABASE,MONGO_ROOT_USERNAME,MONGO_ROOT_PASSWORD,MONGO_USERNAME,MONGO_PASSWORD,SREALITY_BASE_URL,PER_PAGE,MAX_ESTATES,HTTP_CONNECT_TIMEOUT_MS,HTTP_READ_TIMEOUT_MS,REQUEST_DELAY_MS,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID,DEPLOY_PATH
          script: |
            set -e
            cd "$DEPLOY_PATH"

            # Pull latest code
            git pull origin main

            # Write .env safely — values arrive as env vars so special
            # characters ($, &, ^, etc.) are never interpreted by the shell.
            printf '%s\n' \
              "MONGO_HOST=$MONGO_HOST" \
              "MONGO_PORT=$MONGO_PORT" \
              "MONGO_HOST_PORT=$MONGO_HOST_PORT" \
              "MONGO_DATABASE=$MONGO_DATABASE" \
              "MONGO_ROOT_USERNAME=$MONGO_ROOT_USERNAME" \
              "MONGO_ROOT_PASSWORD=$MONGO_ROOT_PASSWORD" \
              "MONGO_USERNAME=$MONGO_USERNAME" \
              "MONGO_PASSWORD=$MONGO_PASSWORD" \
              "SREALITY_BASE_URL=$SREALITY_BASE_URL" \
              "PER_PAGE=$PER_PAGE" \
              "MAX_ESTATES=$MAX_ESTATES" \
              "HTTP_CONNECT_TIMEOUT_MS=$HTTP_CONNECT_TIMEOUT_MS" \
              "HTTP_READ_TIMEOUT_MS=$HTTP_READ_TIMEOUT_MS" \
              "REQUEST_DELAY_MS=$REQUEST_DELAY_MS" \
              "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN" \
              "TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID" \
              > .env

            # Rebuild scraper image and ensure MongoDB is up
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              build --no-cache scraper
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              up -d mongodb

      - name: Notify Telegram
        if: always()
        run: |
          STATUS="${{ job.status }}"
          COMMIT="${{ github.sha }}"
          SHORT="${COMMIT:0:7}"
          MSG="sreality_scraper deploy: *${STATUS}* on \`${SHORT}\` by ${{ github.actor }}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="Markdown" \
            -d text="${MSG}"