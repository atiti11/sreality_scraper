name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  # ===========================================================================
  # Job 1: Build all Maven JARs on the GitHub Actions runner
  # ===========================================================================
  build:
    name: Build JARs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install original scraper
        run: mvn install -DskipTests -q

      - name: Build pipeline JARs
        run: |
          cd pipeline
          mvn package -DskipTests -q
          bash copy_jars.sh

      - name: Install pipeline modules into local .m2
        run: |
          cd pipeline
          mvn install -DskipTests -q

      - name: Build initial-load JAR
        run: |
          cd initial-load
          mvn package -DskipTests -q

      - name: Stage JARs for upload
        run: |
          mkdir -p staging/pipeline-jars
          mkdir -p staging/initial-load
          cp pipeline/jars/jar1-scraper.jar   staging/pipeline-jars/
          cp pipeline/jars/jar2-ruian.jar     staging/pipeline-jars/
          cp pipeline/jars/jar3-csu.jar       staging/pipeline-jars/
          cp pipeline/jars/jar4-enricher.jar  staging/pipeline-jars/
          cp pipeline/jars/jar5-reporter.jar  staging/pipeline-jars/
          cp initial-load/target/initial-load.jar staging/initial-load/

      - name: Upload pipeline JARs
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-jars
          path: staging/pipeline-jars/
          retention-days: 7

      - name: Upload initial-load JAR
        uses: actions/upload-artifact@v4
        with:
          name: initial-load-jar
          path: staging/initial-load/
          retention-days: 7

  # ===========================================================================
  # Job 2: Deploy to Hetzner server
  # ===========================================================================
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build

    env:
      MONGO_ROOT_USERNAME:     ${{ secrets.MONGO_ROOT_USERNAME }}
      MONGO_ROOT_PASSWORD:     ${{ secrets.MONGO_ROOT_PASSWORD }}
      MONGO_USERNAME:          ${{ secrets.MONGO_USERNAME }}
      MONGO_PASSWORD:          ${{ secrets.MONGO_PASSWORD }}
      PG_USERNAME:             ${{ secrets.PG_USERNAME }}
      PG_PASSWORD:             ${{ secrets.PG_PASSWORD }}
      TELEGRAM_BOT_TOKEN:      ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:        ${{ secrets.TELEGRAM_CHAT_ID }}
      AIRFLOW_FERNET_KEY:      ${{ secrets.AIRFLOW_FERNET_KEY }}
      AIRFLOW_SECRET_KEY:      ${{ secrets.AIRFLOW_SECRET_KEY }}
      AIRFLOW_PASSWORD:        ${{ secrets.AIRFLOW_PASSWORD }}
      AIRFLOW_BASE_URL:        ${{ vars.AIRFLOW_BASE_URL }}
      DEPLOY_PATH:             ${{ secrets.DEPLOY_PATH }}
      MONGO_HOST:              ${{ vars.MONGO_HOST }}
      MONGO_PORT:              ${{ vars.MONGO_PORT }}
      MONGO_HOST_PORT:         ${{ vars.MONGO_HOST_PORT }}
      MONGO_DATABASE:          ${{ vars.MONGO_DATABASE }}
      PG_HOST:                 ${{ vars.PG_HOST }}
      PG_PORT:                 ${{ vars.PG_PORT }}
      PG_HOST_PORT:            ${{ vars.PG_HOST_PORT }}
      PG_DATABASE:             ${{ vars.PG_DATABASE }}
      PG_SCHEMA:               ${{ vars.PG_SCHEMA }}
      SREALITY_BASE_URL:       ${{ vars.SREALITY_BASE_URL }}
      PER_PAGE:                ${{ vars.PER_PAGE }}
      MAX_ESTATES:             ${{ vars.MAX_ESTATES }}
      HTTP_CONNECT_TIMEOUT_MS: ${{ vars.HTTP_CONNECT_TIMEOUT_MS }}
      HTTP_READ_TIMEOUT_MS:    ${{ vars.HTTP_READ_TIMEOUT_MS }}
      REQUEST_DELAY_MS:        ${{ vars.REQUEST_DELAY_MS }}
      AIRFLOW_USER:            ${{ vars.AIRFLOW_USER }}
      AIRFLOW_PORT:            ${{ vars.AIRFLOW_PORT }}
      CSU_XLSX_URLS:           ${{ vars.CSU_XLSX_URLS }}
      CSU_YEAR:                ${{ vars.CSU_YEAR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download pipeline JARs
        uses: actions/download-artifact@v4
        with:
          name: pipeline-jars
          path: pipeline/jars/

      - name: Download initial-load JAR
        uses: actions/download-artifact@v4
        with:
          name: initial-load-jar
          path: initial-load/target/

      - name: Verify JARs exist
        run: |
          echo "Pipeline JARs:"
          ls -lh pipeline/jars/
          echo "Initial-load JAR:"
          ls -lh initial-load/target/

      # Step 1: reset local state, then pull, then write .env
      - name: Pull code and write .env
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          envs: >-
            MONGO_HOST,MONGO_PORT,MONGO_HOST_PORT,MONGO_DATABASE,
            MONGO_ROOT_USERNAME,MONGO_ROOT_PASSWORD,MONGO_USERNAME,MONGO_PASSWORD,
            PG_HOST,PG_PORT,PG_HOST_PORT,PG_DATABASE,PG_SCHEMA,PG_USERNAME,PG_PASSWORD,
            SREALITY_BASE_URL,PER_PAGE,MAX_ESTATES,
            HTTP_CONNECT_TIMEOUT_MS,HTTP_READ_TIMEOUT_MS,REQUEST_DELAY_MS,
            TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID,
            AIRFLOW_USER,AIRFLOW_PASSWORD,AIRFLOW_FERNET_KEY,AIRFLOW_SECRET_KEY,AIRFLOW_PORT,AIRFLOW_BASE_URL,
            CSU_XLSX_URLS,CSU_YEAR,
            DEPLOY_PATH
          script: |
            set -e
            cd "$DEPLOY_PATH"

            # Discard local modifications and untracked JAR files before pulling
            git checkout -- .
            git clean -fd pipeline/jars/ initial-load/target/ || true
            git pull origin main

            # Write .env with all values single-quoted so special characters
            # (@, %, *, spaces, etc.) are passed through literally.
            # Docker Compose strips the surrounding single quotes correctly.
            # Note: single quotes cannot appear inside single-quoted values —
            # passwords must not contain literal ' characters.
            cat > .env << ENVEOF
            MONGO_HOST='${MONGO_HOST}'
            MONGO_PORT='${MONGO_PORT}'
            MONGO_HOST_PORT='${MONGO_HOST_PORT}'
            MONGO_DATABASE='${MONGO_DATABASE}'
            MONGO_ROOT_USERNAME='${MONGO_ROOT_USERNAME}'
            MONGO_ROOT_PASSWORD='${MONGO_ROOT_PASSWORD}'
            MONGO_USERNAME='${MONGO_USERNAME}'
            MONGO_PASSWORD='${MONGO_PASSWORD}'
            PG_HOST='${PG_HOST}'
            PG_PORT='${PG_PORT}'
            PG_HOST_PORT='${PG_HOST_PORT}'
            PG_DATABASE='${PG_DATABASE}'
            PG_SCHEMA='${PG_SCHEMA}'
            PG_USERNAME='${PG_USERNAME}'
            PG_PASSWORD='${PG_PASSWORD}'
            SREALITY_BASE_URL='${SREALITY_BASE_URL}'
            PER_PAGE='${PER_PAGE}'
            MAX_ESTATES='${MAX_ESTATES}'
            HTTP_CONNECT_TIMEOUT_MS='${HTTP_CONNECT_TIMEOUT_MS}'
            HTTP_READ_TIMEOUT_MS='${HTTP_READ_TIMEOUT_MS}'
            REQUEST_DELAY_MS='${REQUEST_DELAY_MS}'
            TELEGRAM_BOT_TOKEN='${TELEGRAM_BOT_TOKEN}'
            TELEGRAM_CHAT_ID='${TELEGRAM_CHAT_ID}'
            AIRFLOW_USER='${AIRFLOW_USER}'
            AIRFLOW_PASSWORD='${AIRFLOW_PASSWORD}'
            AIRFLOW_FERNET_KEY='${AIRFLOW_FERNET_KEY}'
            AIRFLOW_SECRET_KEY='${AIRFLOW_SECRET_KEY}'
            AIRFLOW_PORT='${AIRFLOW_PORT}'
            AIRFLOW_BASE_URL='${AIRFLOW_BASE_URL}'
            CSU_XLSX_URLS='${CSU_XLSX_URLS}'
            CSU_YEAR='${CSU_YEAR}'
            ENVEOF

      # Step 2: SCP JARs after git pull
      - name: Copy pipeline JARs to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          source:   "pipeline/jars/"
          target:   ${{ secrets.DEPLOY_PATH }}

      - name: Copy initial-load JAR to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          source:   "initial-load/target/initial-load.jar"
          target:   ${{ secrets.DEPLOY_PATH }}

      # Step 3: restart Docker services
      - name: Restart services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_PATH
          # Long timeout because the airflow-init migration step can take a minute
          # the first time and we wait for webserver health afterwards.
          command_timeout: 15m
          script: |
            set -e
            cd "$DEPLOY_PATH"

            COMPOSE="docker compose -f docker-compose.yml -f docker-compose.pipeline.yml"

            echo "=== JARs on server ==="
            ls -lh pipeline/jars/
            ls -lh initial-load/target/

            # ----- Original scraper + MongoDB -----
            docker compose -f docker-compose.yml build --no-cache scraper
            docker compose -f docker-compose.yml up -d mongodb

            # ----- Postgres + Airflow images -----
            $COMPOSE build --no-cache airflow-webserver airflow-scheduler airflow-init
            $COMPOSE up -d postgres

            # ----- Airflow DB migration (idempotent) -----
            $COMPOSE run --rm airflow-init

            # ----- Webserver + scheduler -----
            $COMPOSE up -d airflow-webserver airflow-scheduler

            # ----- Wait for webserver to report healthy -----
            echo "Waiting for airflow-webserver to become healthy..."
            for i in $(seq 1 60); do
                STATUS=$(docker inspect --format='{{.State.Health.Status}}' \
                    sreality-airflow-webserver 2>/dev/null || echo "starting")
                if [ "$STATUS" = "healthy" ]; then
                    echo "Webserver healthy after ${i}x5s"
                    break
                fi
                if [ "$i" = "60" ]; then
                    echo "ERROR: webserver did not become healthy in 5 minutes"
                    docker logs sreality-airflow-webserver --tail 80
                    exit 1
                fi
                sleep 5
            done

            # ----- Wait for scheduler to parse the DAGs folder -----
            echo "Waiting for scheduler to parse DAGs..."
            for i in $(seq 1 30); do
                if docker exec sreality-airflow-scheduler airflow dags list 2>/dev/null \
                    | grep -q "sreality_pipeline"; then
                    echo "DAG sreality_pipeline registered after ${i}x5s"
                    break
                fi
                if [ "$i" = "30" ]; then
                    echo "WARN: sreality_pipeline DAG not registered after 2.5 minutes"
                    docker logs sreality-airflow-scheduler --tail 50
                    # Don't fail the deploy — DAG file might just be missing or have parse error
                fi
                sleep 5
            done

            # ----- Auto-unpause sreality_pipeline so the 12h schedule kicks in -----
            docker exec sreality-airflow-scheduler airflow dags unpause sreality_pipeline \
                || echo "WARN: could not unpause sreality_pipeline (will need to be done manually in UI)"

            # ----- Final status summary -----
            echo ""
            echo "=== Container status ==="
            $COMPOSE ps

            echo ""
            echo "=== DAGs ==="
            docker exec sreality-airflow-scheduler airflow dags list 2>/dev/null \
                | grep -E "dag_id|sreality|csu" || true

            echo ""
            echo "=== Health endpoint ==="
            curl -s http://127.0.0.1:8080/health | head -c 500 || echo "webserver not reachable on 127.0.0.1:8080"
            echo ""

      - name: Notify Telegram
        if: always()
        run: |
          STATUS="${{ job.status }}"
          SHORT="${{ github.sha }}"
          SHORT="${SHORT:0:7}"
          MSG="sreality deploy: *${STATUS}* on \`${SHORT}\` by ${{ github.actor }}"
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="Markdown" \
            -d text="${MSG}"
