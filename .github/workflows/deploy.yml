name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  # ===========================================================================
  # Job 1: Build all Maven JARs on the GitHub Actions runner
  # ===========================================================================
  build:
    name: Build JARs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install original scraper
        run: mvn install -DskipTests -q

      - name: Build pipeline JARs
        run: |
          cd pipeline
          mvn package -DskipTests -q
          bash copy_jars.sh

      - name: Install pipeline modules into local .m2
        run: |
          cd pipeline
          mvn install -DskipTests -q

      - name: Build initial-load JAR
        run: |
          cd initial-load
          mvn package -DskipTests -q

      # Stage all JARs into clean flat directories before uploading
      - name: Stage JARs for upload
        run: |
          mkdir -p staging/pipeline-jars
          mkdir -p staging/initial-load
          cp pipeline/jars/jar1-scraper.jar   staging/pipeline-jars/
          cp pipeline/jars/jar2-ruian.jar     staging/pipeline-jars/
          cp pipeline/jars/jar3-csu.jar       staging/pipeline-jars/
          cp pipeline/jars/jar4-enricher.jar  staging/pipeline-jars/
          cp pipeline/jars/jar5-reporter.jar  staging/pipeline-jars/
          cp initial-load/target/initial-load.jar staging/initial-load/

      - name: Upload pipeline JARs
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-jars
          path: staging/pipeline-jars/
          retention-days: 7

      - name: Upload initial-load JAR
        uses: actions/upload-artifact@v4
        with:
          name: initial-load-jar
          path: staging/initial-load/
          retention-days: 7

  # ===========================================================================
  # Job 2: Deploy to Hetzner server
  #
  # Order matters to avoid git conflicts:
  #   1. SSH: git pull (clean state, no JARs yet)
  #   2. SCP: copy JARs (after git pull, so no conflict with .gitkeep)
  #   3. SSH: docker compose restart
  # ===========================================================================
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build

    env:
      MONGO_ROOT_USERNAME:     ${{ secrets.MONGO_ROOT_USERNAME }}
      MONGO_ROOT_PASSWORD:     ${{ secrets.MONGO_ROOT_PASSWORD }}
      MONGO_USERNAME:          ${{ secrets.MONGO_USERNAME }}
      MONGO_PASSWORD:          ${{ secrets.MONGO_PASSWORD }}
      PG_USERNAME:             ${{ secrets.PG_USERNAME }}
      PG_PASSWORD:             ${{ secrets.PG_PASSWORD }}
      TELEGRAM_BOT_TOKEN:      ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:        ${{ secrets.TELEGRAM_CHAT_ID }}
      AIRFLOW_FERNET_KEY:      ${{ secrets.AIRFLOW_FERNET_KEY }}
      AIRFLOW_SECRET_KEY:      ${{ secrets.AIRFLOW_SECRET_KEY }}
      AIRFLOW_PASSWORD:        ${{ secrets.AIRFLOW_PASSWORD }}
      DEPLOY_PATH:             ${{ secrets.DEPLOY_PATH }}
      MONGO_HOST:              ${{ vars.MONGO_HOST }}
      MONGO_PORT:              ${{ vars.MONGO_PORT }}
      MONGO_HOST_PORT:         ${{ vars.MONGO_HOST_PORT }}
      MONGO_DATABASE:          ${{ vars.MONGO_DATABASE }}
      PG_HOST:                 ${{ vars.PG_HOST }}
      PG_PORT:                 ${{ vars.PG_PORT }}
      PG_HOST_PORT:            ${{ vars.PG_HOST_PORT }}
      PG_DATABASE:             ${{ vars.PG_DATABASE }}
      PG_SCHEMA:               ${{ vars.PG_SCHEMA }}
      SREALITY_BASE_URL:       ${{ vars.SREALITY_BASE_URL }}
      PER_PAGE:                ${{ vars.PER_PAGE }}
      MAX_ESTATES:             ${{ vars.MAX_ESTATES }}
      HTTP_CONNECT_TIMEOUT_MS: ${{ vars.HTTP_CONNECT_TIMEOUT_MS }}
      HTTP_READ_TIMEOUT_MS:    ${{ vars.HTTP_READ_TIMEOUT_MS }}
      REQUEST_DELAY_MS:        ${{ vars.REQUEST_DELAY_MS }}
      AIRFLOW_USER:            ${{ vars.AIRFLOW_USER }}
      AIRFLOW_PORT:            ${{ vars.AIRFLOW_PORT }}
      CSU_XLSX_URLS:           ${{ vars.CSU_XLSX_URLS }}
      CSU_YEAR:                ${{ vars.CSU_YEAR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download pipeline JARs
        uses: actions/download-artifact@v4
        with:
          name: pipeline-jars
          path: pipeline/jars/

      - name: Download initial-load JAR
        uses: actions/download-artifact@v4
        with:
          name: initial-load-jar
          path: initial-load/target/

      - name: Verify JARs exist
        run: |
          echo "Pipeline JARs:"
          ls -lh pipeline/jars/
          echo "Initial-load JAR:"
          ls -lh initial-load/target/

      # Step 1: git pull + write .env (no JARs on server yet — no conflict)
      - name: Pull code and write .env
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          envs: >-
            MONGO_HOST,MONGO_PORT,MONGO_HOST_PORT,MONGO_DATABASE,
            MONGO_ROOT_USERNAME,MONGO_ROOT_PASSWORD,MONGO_USERNAME,MONGO_PASSWORD,
            PG_HOST,PG_PORT,PG_HOST_PORT,PG_DATABASE,PG_SCHEMA,PG_USERNAME,PG_PASSWORD,
            SREALITY_BASE_URL,PER_PAGE,MAX_ESTATES,
            HTTP_CONNECT_TIMEOUT_MS,HTTP_READ_TIMEOUT_MS,REQUEST_DELAY_MS,
            TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID,
            AIRFLOW_USER,AIRFLOW_PASSWORD,AIRFLOW_FERNET_KEY,AIRFLOW_SECRET_KEY,AIRFLOW_PORT,
            CSU_XLSX_URLS,CSU_YEAR,
            DEPLOY_PATH
          script: |
            set -e
            cd "$DEPLOY_PATH"

            # Pull latest code — .gitkeep is tracked so git manages it cleanly
            git pull origin main

            escape() { printf '%s' "$1" | sed 's/\$/\$\$/g'; }

            printf '%s\n' \
              "MONGO_HOST=$(escape "$MONGO_HOST")" \
              "MONGO_PORT=$(escape "$MONGO_PORT")" \
              "MONGO_HOST_PORT=$(escape "$MONGO_HOST_PORT")" \
              "MONGO_DATABASE=$(escape "$MONGO_DATABASE")" \
              "MONGO_ROOT_USERNAME=$(escape "$MONGO_ROOT_USERNAME")" \
              "MONGO_ROOT_PASSWORD=$(escape "$MONGO_ROOT_PASSWORD")" \
              "MONGO_USERNAME=$(escape "$MONGO_USERNAME")" \
              "MONGO_PASSWORD=$(escape "$MONGO_PASSWORD")" \
              "PG_HOST=$(escape "$PG_HOST")" \
              "PG_PORT=$(escape "$PG_PORT")" \
              "PG_HOST_PORT=$(escape "$PG_HOST_PORT")" \
              "PG_DATABASE=$(escape "$PG_DATABASE")" \
              "PG_SCHEMA=$(escape "$PG_SCHEMA")" \
              "PG_USERNAME=$(escape "$PG_USERNAME")" \
              "PG_PASSWORD=$(escape "$PG_PASSWORD")" \
              "SREALITY_BASE_URL=$(escape "$SREALITY_BASE_URL")" \
              "PER_PAGE=$(escape "$PER_PAGE")" \
              "MAX_ESTATES=$(escape "$MAX_ESTATES")" \
              "HTTP_CONNECT_TIMEOUT_MS=$(escape "$HTTP_CONNECT_TIMEOUT_MS")" \
              "HTTP_READ_TIMEOUT_MS=$(escape "$HTTP_READ_TIMEOUT_MS")" \
              "REQUEST_DELAY_MS=$(escape "$REQUEST_DELAY_MS")" \
              "TELEGRAM_BOT_TOKEN=$(escape "$TELEGRAM_BOT_TOKEN")" \
              "TELEGRAM_CHAT_ID=$(escape "$TELEGRAM_CHAT_ID")" \
              "AIRFLOW_USER=$(escape "$AIRFLOW_USER")" \
              "AIRFLOW_PASSWORD=$(escape "$AIRFLOW_PASSWORD")" \
              "AIRFLOW_FERNET_KEY=$(escape "$AIRFLOW_FERNET_KEY")" \
              "AIRFLOW_SECRET_KEY=$(escape "$AIRFLOW_SECRET_KEY")" \
              "AIRFLOW_PORT=$(escape "$AIRFLOW_PORT")" \
              "CSU_XLSX_URLS=$(escape "$CSU_XLSX_URLS")" \
              "CSU_YEAR=$(escape "$CSU_YEAR")" \
              > .env

      # Step 2: SCP JARs — runs after git pull so no .gitkeep conflict
      - name: Copy pipeline JARs to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          source:   "pipeline/jars/"
          target:   ${{ secrets.DEPLOY_PATH }}

      - name: Copy initial-load JAR to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          source:   "initial-load/target/initial-load.jar"
          target:   ${{ secrets.DEPLOY_PATH }}/initial-load/target/

      # Step 3: restart Docker services
      - name: Restart services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_PATH
          script: |
            set -e
            cd "$DEPLOY_PATH"

            echo "=== JARs on server ==="
            ls -lh pipeline/jars/
            ls -lh initial-load/target/

            # Original scraper + MongoDB
            docker compose -f docker-compose.yml build --no-cache scraper
            docker compose -f docker-compose.yml up -d mongodb

            # Pipeline: Postgres + Airflow
            docker compose -f docker-compose.yml -f docker-compose.pipeline.yml \
              build --no-cache airflow-webserver airflow-scheduler airflow-init
            docker compose -f docker-compose.yml -f docker-compose.pipeline.yml \
              up -d postgres
            docker compose -f docker-compose.yml -f docker-compose.pipeline.yml \
              run --rm airflow-init
            docker compose -f docker-compose.yml -f docker-compose.pipeline.yml \
              up -d airflow-webserver airflow-scheduler

      - name: Notify Telegram
        if: always()
        run: |
          STATUS="${{ job.status }}"
          SHORT="${{ github.sha }}"
          SHORT="${SHORT:0:7}"
          MSG="sreality deploy: *${STATUS}* on \`${SHORT}\` by ${{ github.actor }}"
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="Markdown" \
            -d text="${MSG}"
