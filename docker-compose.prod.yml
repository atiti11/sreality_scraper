services:
  mongodb:
    image: mongo:7.0.12
    deploy:
      resources:
        limits:
          memory: 512m

  scraper:
    deploy:
      resources:
        reservations:
          memory: 64m
        limits:
          memory: 512m
          pids: 50
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  postgres:
    image: postgres:16.3
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  etl:
    deploy:
      resources:
        reservations:
          memory: 64m
        limits:
          memory: 768m   # JVM Xmx512m + OS/JVM overhead headroom
          pids: 50
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
