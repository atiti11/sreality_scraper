networks:
  scraper-net:
    name: scraper-shared-net
    driver: bridge

volumes:
  mongo-data:


services:

  mongodb:
    image: mongo:7.0
    container_name: sreality-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-adminpassword}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-sreality}
      MONGO_USERNAME: ${MONGO_USERNAME:-scraper}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-changeme}
    # Cap WiredTiger cache to 0.5 GB (default is 50 % of total RAM = 4 GB on
    # this host, which would crowd out other containers).
    command: ["mongod", "--auth", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.5"]
    volumes:
      - mongo-data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    networks:
      - scraper-net
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:-27018}:27017"
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 1500m
