version: "3.9"

# ──────────────────────────────────────────────────────────────────
# Networks
# ──────────────────────────────────────────────────────────────────
networks:
  scraper-net:
    driver: bridge

# ──────────────────────────────────────────────────────────────────
# Named volumes
# ──────────────────────────────────────────────────────────────────
volumes:
  mongo-data:          # persistent MongoDB data
  scraper-logs:        # persistent application logs

# ──────────────────────────────────────────────────────────────────
# Services
# ──────────────────────────────────────────────────────────────────
services:

  # ── MongoDB ────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: sreality-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-adminpassword}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-sreality}
    volumes:
      - mongo-data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro   # init scripts
    networks:
      - scraper-net
    # Expose port only on localhost – do NOT expose publicly on VPS
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Java Scraper ───────────────────────────────────────────────
  scraper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sreality-scraper
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy   # wait until Mongo is ready
    env_file:
      - .env                         # real secrets (git-ignored)
    environment:
      MONGO_HOST: mongodb            # hostname = service name on the shared network
      MONGO_PORT: 27017
      MONGO_DATABASE: ${MONGO_DATABASE:-sreality}
      MONGO_USERNAME: ${MONGO_USERNAME:-scraper}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-changeme}
    volumes:
      - scraper-logs:/app/logs
    networks:
      - scraper-net
    # No ports needed – scraper only talks outbound (sreality) and to mongo
