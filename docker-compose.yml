networks:
  scraper-net:
    driver: bridge

volumes:
  mongo-data:
  scraper-logs:

services:

  mongodb:
    image: mongo:7.0
    container_name: sreality-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-adminpassword}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-sreality}
    volumes:
      - mongo-data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    networks:
      - scraper-net
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  scraper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sreality-scraper
    restart: "no"   # stateless — run once per cron trigger, do not auto-restart
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DATABASE: ${MONGO_DATABASE:-sreality}
      MONGO_USERNAME: ${MONGO_USERNAME:-scraper}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-changeme}
      SREALITY_BASE_URL: ${SREALITY_BASE_URL:-https://www.sreality.cz/api/cs/v2/estates}
      PER_PAGE: ${PER_PAGE:-100}
      MAX_ESTATES: ${MAX_ESTATES:-0}
      HTTP_CONNECT_TIMEOUT_MS: ${HTTP_CONNECT_TIMEOUT_MS:-10000}
      HTTP_READ_TIMEOUT_MS: ${HTTP_READ_TIMEOUT_MS:-30000}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      REQUEST_DELAY_MS: ${REQUEST_DELAY_MS:-500}
    volumes:
      - scraper-logs:/app/logs
    networks:
      - scraper-net
